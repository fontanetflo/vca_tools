<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">

<title>VCA Capture</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f2f3f5;
  color: #111827;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.app {
  width: 100%;
  max-width: 520px;
  margin: auto;
  min-height: 100vh;
  padding: 18px 16px 35px;
}

header {
  text-align: center;
  margin-bottom: 18px;
}

.logo {
  font-size: 38px;
  line-height: 1;
}

h1 {
  margin: 7px 0 0;
  font-size: 25px;
}

.subtitle {
  margin-top: 4px;
  font-size: 14px;
  color: #6b7280;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 17px;
  margin-bottom: 13px;
  box-shadow: 0 5px 18px rgba(0,0,0,.06);
}

.section-title {
  font-size: 15px;
  font-weight: 750;
  margin-bottom: 11px;
}

input[type="text"] {
  width: 100%;
  height: 48px;
  padding: 0 13px;
  border-radius: 11px;
  border: 1px solid #d1d5db;
  background: #fff;
  font-size: 16px;
  outline: none;
}

input[type="text"]:focus {
  border-color: #111827;
}

.session {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: #f3f4f6;
}

.session-name {
  font-weight: 700;
  font-size: 14px;
}

.session-date {
  margin-top: 2px;
  color: #6b7280;
  font-size: 12px;
}

button,
.action-button {
  width: 100%;
  min-height: 48px;
  border: 0;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-align: center;
  text-decoration: none;
}

.primary {
  background: #111827;
  color: white;
}

.secondary {
  background: #eef0f3;
  color: #111827;
}

.danger {
  background: #fee2e2;
  color: #991b1b;
}

input[type="file"] {
  display: none;
}

.capture-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.capture-grid .action-button {
  margin: 0;
}

.import-button {
  margin-top: 10px;
}

.file-count {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.file-count strong {
  font-size: 15px;
}

.file-count span {
  color: #6b7280;
  font-size: 13px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

.item {
  position: relative;
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: 10px;
  background: #e5e7eb;
}

.item img,
.item video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.badge {
  position: absolute;
  bottom: 5px;
  left: 5px;
  padding: 3px 5px;
  border-radius: 5px;
  background: rgba(0,0,0,.72);
  color: white;
  font-size: 9px;
  font-weight: 700;
}

.delete {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 27px;
  min-height: 27px;
  height: 27px;
  padding: 0;
  border-radius: 50%;
  background: rgba(0,0,0,.72);
  color: white;
  font-size: 17px;
  line-height: 27px;
}

.actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 13px;
}

.actions button {
  margin: 0;
}

.info {
  padding: 11px 13px;
  border-radius: 11px;
  background: #e9edf2;
  color: #4b5563;
  font-size: 12px;
  line-height: 1.4;
  text-align: center;
}

.empty {
  padding: 22px 10px;
  text-align: center;
  color: #9ca3af;
  font-size: 14px;
}

.hidden {
  display: none !important;
}

@media (max-width: 360px) {
  .capture-grid {
    grid-template-columns: 1fr;
  }

  .app {
    padding-left: 12px;
    padding-right: 12px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">🧪</div>
  <h1>VCA Capture</h1>
  <div class="subtitle">Photos et vidéos d'essais</div>
</header>


<!-- ESSAI -->

<div class="card">

  <div class="section-title">
    🏷️ Essai
  </div>

  <input
    id="sessionName"
    type="text"
    placeholder="Nom de l'essai"
  >

  <div
    id="sessionInfo"
    class="session hidden"
  >
    <div
      id="displayName"
      class="session-name"
    ></div>

    <div
      id="displayDate"
      class="session-date"
    ></div>
  </div>

</div>


<!-- CAPTURE -->

<div class="card">

  <div class="section-title">
    📸 Capture
  </div>

  <div class="capture-grid">

    <!-- PHOTO NATIVE IPHONE -->

    <label
      for="photoInput"
      class="action-button primary"
    >
      📷 Photo
    </label>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      capture="environment"
      multiple
    >


    <!-- VIDEO NATIVE IPHONE -->

    <label
      for="videoInput"
      class="action-button secondary"
    >
      🎥 Vidéo
    </label>

    <input
      id="videoInput"
      type="file"
      accept="video/*"
      capture="environment"
    >

  </div>

</div>


<!-- IMPORT -->

<div class="card">

  <div class="section-title">
    📁 Import
  </div>

  <label
    for="fileInput"
    class="action-button secondary"
  >
    📁 Importer depuis Fichiers
  </label>

  <input
    id="fileInput"
    type="file"
    accept="image/*,video/*"
    multiple
  >

</div>


<!-- FICHIERS -->

<div class="card">

  <div class="file-count">

    <strong>
      Fichiers de la série
    </strong>

    <span id="count">
      0 fichier
    </span>

  </div>


  <div
    id="empty"
    class="empty"
  >
    Aucun fichier pour le moment
  </div>


  <div
    id="grid"
    class="grid"
  ></div>


  <div
    id="actions"
    class="actions hidden"
  >

    <button
      class="primary"
      onclick="shareFiles()"
    >
      💾 Enregistrer dans Fichiers
    </button>


    <button
      class="secondary"
      onclick="openFolder()"
    >
      📂 Ouvrir Dossiers Essais
    </button>


    <button
      class="danger"
      onclick="clearFiles()"
    >
      🗑️ Effacer la série
    </button>

  </div>

</div>


<div
  id="message"
  class="info"
>
  Donne un nom à l'essai puis commence une capture.
</div>

</div>


<script>

const SHAREPOINT_FOLDER =
"https://richemont.sharepoint.com/sites/VCAlab/Dossiers%20Essais/";


let files = [];

let photoNumber = 0;

let videoNumber = 0;


const photoInput =
document.getElementById("photoInput");

const videoInput =
document.getElementById("videoInput");

const fileInput =
document.getElementById("fileInput");

const sessionName =
document.getElementById("sessionName");

const sessionInfo =
document.getElementById("sessionInfo");

const displayName =
document.getElementById("displayName");

const displayDate =
document.getElementById("displayDate");

const grid =
document.getElementById("grid");

const empty =
document.getElementById("empty");

const count =
document.getElementById("count");

const actions =
document.getElementById("actions");

const message =
document.getElementById("message");


/* =========================
   SESSION
========================= */

sessionName.addEventListener(
  "input",
  updateSession
);


function updateSession() {

  const name =
    sessionName.value.trim();


  if (!name) {

    sessionInfo.classList.add(
      "hidden"
    );

    message.textContent =
      "Donne un nom à l'essai puis commence une capture.";

    return;
  }


  sessionInfo.classList.remove(
    "hidden"
  );


  displayName.textContent =
    name;


  displayDate.textContent =
    new Date().toLocaleString(
      "fr-FR",
      {
        dateStyle: "short",
        timeStyle: "short"
      }
    );


  message.textContent =
    "Essai prêt. Tu peux commencer.";

}


/* =========================
   NOM DE FICHIER
========================= */

function getSafeSessionName() {

  const name =
    sessionName.value.trim() ||
    "Essai";


  return name
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .replace(
      /[^a-zA-Z0-9_-]+/g,
      "-"
    )
    .replace(
      /-+/g,
      "-"
    )
    .replace(
      /^-|-$/g,
      "");

}


/* =========================
   DATE
========================= */

function getDateString() {

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");


  const day =
    String(
      now.getDate()
    ).padStart(2, "0");


  const hour =
    String(
      now.getHours()
    ).padStart(2, "0");


  const minute =
    String(
      now.getMinutes()
    ).padStart(2, "0");


  return (
    year +
    "-" +
    month +
    "-" +
    day +
    "_" +
    hour +
    "-" +
    minute
  );

}


/* =========================
   EXTENSIONS
========================= */

function getImageExtension(file) {

  const type =
    file.type.toLowerCase();


  if (type.includes("png"))
    return "png";


  if (type.includes("heic"))
    return "heic";


  if (type.includes("webp"))
    return "webp";


  if (type.includes("jpeg"))
    return "jpg";


  return "jpg";

}


function getVideoExtension(file) {

  const type =
    file.type.toLowerCase();


  if (type.includes("mp4"))
    return "mp4";


  if (type.includes("quicktime"))
    return "mov";


  if (type.includes("webm"))
    return "webm";


  return "mp4";

}


/* =========================
   AJOUT PHOTO
========================= */

photoInput.addEventListener(
  "change",
  function(event) {

    const selected =
      Array.from(
        event.target.files
      );


    let added = 0;


    selected.forEach(
      function(file) {

        if (
          !file.type.startsWith(
            "image/"
          )
        ) {
          return;
        }


        photoNumber++;


        const filename =
          getSafeSessionName() +
          "_" +
          getDateString() +
          "_photo_" +
          String(photoNumber)
            .padStart(2, "0") +
          "." +
          getImageExtension(file);


        files.push(
          new File(
            [file],
            filename,
            {
              type: file.type,
              lastModified:
                file.lastModified
            }
          )
        );


        added++;

      }
    );


    photoInput.value = "";


    renderFiles();


    if (added) {

      message.textContent =
        added +
        " photo" +
        (
          added > 1
          ? "s"
          : ""
        ) +
        " ajoutée" +
        (
          added > 1
          ? "s"
          : ""
        ) +
        " à la série.";

    }

  }
);


/* =========================
   AJOUT VIDEO
========================= */

videoInput.addEventListener(
  "change",
  function(event) {

    const selected =
      Array.from(
        event.target.files
      );


    let added = 0;


    selected.forEach(
      function(file) {

        if (
          !file.type.startsWith(
            "video/"
          )
        ) {
          return;
        }


        videoNumber++;


        const filename =
          getSafeSessionName() +
          "_" +
          getDateString() +
          "_video_" +
          String(videoNumber)
            .padStart(2, "0") +
          "." +
          getVideoExtension(file);


        files.push(
          new File(
            [file],
            filename,
            {
              type: file.type,
              lastModified:
                file.lastModified
            }
          )
        );


        added++;

      }
    );


    videoInput.value = "";


    renderFiles();


    if (added) {

      message.textContent =
        added +
        " vidéo" +
        (
          added > 1
          ? "s"
          : ""
        ) +
        " ajoutée" +
        (
          added > 1
          ? "s"
          : ""
        ) +
        " à la série.";

    }

  }
);


/* =========================
   IMPORT FICHIERS
========================= */

fileInput.addEventListener(
  "change",
  function(event) {

    const selected =
      Array.from(
        event.target.files
      );


    let added = 0;


    selected.forEach(
      function(file) {

        const isImage =
          file.type.startsWith(
            "image/"
          );


        const isVideo =
          file.type.startsWith(
            "video/"
          );


        if (
          !isImage &&
          !isVideo
        ) {
          return;
        }


        let filename;


        if (isImage) {

          photoNumber++;


          filename =
            getSafeSessionName() +
            "_" +
            getDateString() +
            "_photo_" +
            String(photoNumber)
              .padStart(2, "0") +
            "." +
            getImageExtension(file);

        }

        else {

          videoNumber++;


          filename =
            getSafeSessionName() +
            "_" +
            getDateString() +
            "_video_" +
            String(videoNumber)
              .padStart(2, "0") +
            "." +
            getVideoExtension(file);

        }


        files.push(
          new File(
            [file],
            filename,
            {
              type: file.type,
              lastModified:
                file.lastModified
            }
          )
        );


        added++;

      }
    );


    fileInput.value = "";


    renderFiles();


    if (added) {

      message.textContent =
        added +
        " fichier" +
        (
          added > 1
          ? "s"
          : ""
        ) +
        " importé" +
        (
          added > 1
          ? "s"
          : ""
        ) +
        " dans la série.";

    }

  }
);


/* =========================
   AFFICHAGE
========================= */

function renderFiles() {

  grid.innerHTML = "";


  files.forEach(
    function(file, index) {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "item";


      let media;


      if (
        file.type.startsWith(
          "video/"
        )
      ) {

        media =
          document.createElement(
            "video"
          );


        media.src =
          URL.createObjectURL(
            file
          );


        media.muted =
          true;


        media.playsInline =
          true;

      }

      else {

        media =
          document.createElement(
            "img"
          );


        media.src =
          URL.createObjectURL(
            file
          );

      }


      const badge =
        document.createElement(
          "div"
        );


      badge.className =
        "badge";


      badge.textContent =
        file.type.startsWith(
          "video/"
        )
        ? "VIDÉO"
        : "PHOTO";


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "delete";


      deleteButton.textContent =
        "×";


      deleteButton.onclick =
        function() {

          files.splice(
            index,
            1
          );


          renderFiles();

        };


      item.appendChild(
        media
      );


      item.appendChild(
        badge
      );


      item.appendChild(
        deleteButton
      );


      grid.appendChild(
        item
      );

    }
  );


  const total =
    files.length;


  empty.classList.toggle(
    "hidden",
    total !== 0
  );


  actions.classList.toggle(
    "hidden",
    total === 0
  );


  count.textContent =
    total +
    " fichier" +
    (
      total > 1
      ? "s"
      : ""
    );

}


/* =========================
   EXPORT
========================= */

async function shareFiles() {

  if (!files.length)
    return;


  try {

    if (
      navigator.canShare &&
      navigator.canShare({
        files: files
      })
    ) {

      await navigator.share(
        {
          files: files,

          title:
            sessionName.value ||
            "Essai",

          text:
            "Photos et vidéos d'essai"
        }
      );


      message.innerHTML =
        "✓ Choisis <b>Enregistrer dans Fichiers</b>, puis ton emplacement OneDrive/SharePoint.";

    }

    else {

      message.textContent =
        "Le partage de fichiers n'est pas disponible sur ce navigateur.";

    }

  }

  catch (error) {

    if (
      error.name !==
      "AbortError"
    ) {

      message.textContent =
        "Le partage n'a pas pu être lancé.";

    }

  }

}


/* =========================
   SHAREPOINT
========================= */

function openFolder() {

  window.location.href =
    SHAREPOINT_FOLDER;

}


/* =========================
   EFFACER
========================= */

function clearFiles() {

  files = [];

  photoNumber = 0;

  videoNumber = 0;

  renderFiles();

  message.textContent =
    "Série effacée. Tu peux commencer un nouvel essai.";

}


/* INITIALISATION */

renderFiles();

</script>

</body>
</html>
