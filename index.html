<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Photo → OneDrive</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f3f5;
      color: #111827;
    }

    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      padding: 30px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 50px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      margin-top: 8px;
      color: #6b7280;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 22px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .camera-button {
      display: block;
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      background: #111827;
      color: white;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    input {
      display: none;
    }

    .status {
      text-align: center;
      margin-top: 20px;
      color: #6b7280;
    }

    .count {
      text-align: center;
      font-weight: 700;
      margin-top: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 20px;
    }

    .photo {
      position: relative;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #e5e7eb;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .delete {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      color: white;
      font-size: 18px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #d1d5db;
      background: white;
      font-size: 16px;
      font-weight: 600;
    }

    .info {
      margin-top: 20px;
      padding: 14px;
      border-radius: 14px;
      background: #f3f4f6;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.4;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">📷</div>
    <h1>Photo → OneDrive</h1>
    <div class="subtitle">
      Capture rapide de photos
    </div>
  </header>

  <div class="card">

    <label for="camera" class="camera-button">
      📷 Nouvelle série
    </label>

    <input
      id="camera"
      type="file"
      accept="image/*"
      capture="environment"
      multiple
    >

    <div id="empty" class="status">
      Aucune photo en attente
    </div>

    <div id="count" class="count hidden"></div>

    <div id="grid" class="grid"></div>

    <div id="actions" class="actions hidden">
      <button onclick="clearPhotos()">
        Effacer
      </button>

      <button onclick="fakeUpload()">
        ☁️ Envoyer
      </button>
    </div>

    <div id="message" class="info">
      Les photos restent uniquement dans cette page
      pour le moment.
    </div>

  </div>

</div>

<script>

let photos = [];

const camera = document.getElementById("camera");
const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const count = document.getElementById("count");
const actions = document.getElementById("actions");
const message = document.getElementById("message");

camera.addEventListener("change", function(event) {

  const files = Array.from(event.target.files);

  files.forEach(file => {

    if (file.type.startsWith("image/")) {
      photos.push(file);
    }

  });

  camera.value = "";

  displayPhotos();

});


function displayPhotos() {

  grid.innerHTML = "";

  photos.forEach((file, index) => {

    const container = document.createElement("div");
    container.className = "photo";

    const image = document.createElement("img");

    image.src = URL.createObjectURL(file);

    const deleteButton = document.createElement("button");

    deleteButton.className = "delete";
    deleteButton.innerHTML = "×";

    deleteButton.onclick = function() {

      photos.splice(index, 1);

      displayPhotos();

    };

    container.appendChild(image);
    container.appendChild(deleteButton);

    grid.appendChild(container);

  });

  const number = photos.length;

  empty.classList.toggle("hidden", number > 0);
  count.classList.toggle("hidden", number === 0);
  actions.classList.toggle("hidden", number === 0);

  count.textContent =
    number + " photo" + (number > 1 ? "s" : "") + " en attente";

}


function clearPhotos() {

  photos = [];

  message.textContent =
    "Les photos restent uniquement dans cette page pour le moment.";

  displayPhotos();

}


function fakeUpload() {

  message.innerHTML =
    "✓ Test réussi. La prochaine étape sera l'envoi réel vers OneDrive.";

}


</script>

</body>
</html>
