<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#111827"
>

<title>VCA Capture</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f2f3f5;
  color: #111827;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.app {
  width: 100%;
  max-width: 520px;
  margin: auto;
  min-height: 100vh;
  padding: 18px 16px 35px;
}

header {
  text-align: center;
  margin-bottom: 18px;
}

.logo {
  font-size: 38px;
}

h1 {
  margin: 7px 0 0;
  font-size: 25px;
}

.subtitle {
  margin-top: 4px;
  font-size: 14px;
  color: #6b7280;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 17px;
  margin-bottom: 13px;
  box-shadow: 0 5px 18px rgba(0,0,0,.06);
}

.section-title {
  font-size: 15px;
  font-weight: 750;
  margin-bottom: 11px;
}

input[type="text"] {
  width: 100%;
  height: 48px;
  padding: 0 13px;
  border-radius: 11px;
  border: 1px solid #d1d5db;
  background: white;
  font-size: 16px;
  outline: none;
}

button,
.action-button {
  width: 100%;
  min-height: 48px;
  border: 0;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.primary {
  background: #111827;
  color: white;
}

.secondary {
  background: #eef0f3;
  color: #111827;
}

.danger {
  background: #fee2e2;
  color: #991b1b;
}

input[type="file"] {
  display: none;
}

.capture-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.session {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: #f3f4f6;
}

.session-name {
  font-weight: 700;
  font-size: 14px;
}

.session-date {
  margin-top: 2px;
  color: #6b7280;
  font-size: 12px;
}

.file-count {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 7px;
}

.item {
  position: relative;
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: 10px;
  background: #e5e7eb;
  cursor: pointer;
}

.item img,
.item video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.badge {
  position: absolute;
  bottom: 5px;
  left: 5px;
  padding: 3px 5px;
  border-radius: 5px;
  background: rgba(0,0,0,.72);
  color: white;
  font-size: 9px;
  font-weight: 700;
}

.file-info {
  position: absolute;
  right: 5px;
  bottom: 5px;
  padding: 3px 5px;
  border-radius: 5px;
  background: rgba(0,0,0,.72);
  color: white;
  font-size: 8px;
}

.delete {
  position: absolute;
  right: 5px;
  top: 5px;
  width: 27px;
  height: 27px;
  min-height: 27px;
  padding: 0;
  border-radius: 50%;
  background: rgba(0,0,0,.72);
  color: white;
  z-index: 5;
}

.actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 13px;
}

.info {
  padding: 11px 13px;
  border-radius: 11px;
  background: #e9edf2;
  color: #4b5563;
  font-size: 12px;
  text-align: center;
}


/* =========================
   MODAL GENERAL
========================= */

.modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0,0,0,.96);
  display: flex;
  flex-direction: column;
}

.hidden {
  display: none !important;
}


/* =========================
   CHOIX QUALITÉ
========================= */

.quality-content {
  margin: auto;
  width: calc(100% - 30px);
  max-width: 430px;
  background: white;
  border-radius: 20px;
  padding: 20px;
}

.quality-title {
  font-size: 21px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 18px;
}

.quality-button {
  margin-bottom: 10px;
  min-height: 65px;
  background: #f1f3f5;
  flex-direction: column;
  gap: 3px;
}

.quality-button strong {
  font-size: 17px;
}

.quality-button span {
  color: #6b7280;
  font-size: 12px;
}


/* =========================
   CAMÉRA
========================= */

.camera-container {
  position: relative;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  align-items: center;
  justify-content: center;
}

#cameraPreview {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.camera-top {
  position: absolute;
  top: max(15px, env(safe-area-inset-top));
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  color: white;
  z-index: 10;
}

.camera-quality {
  padding: 7px 10px;
  background: rgba(0,0,0,.55);
  border-radius: 9px;
  font-size: 12px;
}

.camera-bottom {
  position: absolute;
  bottom: max(25px, env(safe-area-inset-bottom));
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  z-index: 10;
}

.record-button {
  width: 76px;
  height: 76px;
  min-height: 76px;
  border-radius: 50%;
  background: white;
  border: 7px solid rgba(255,255,255,.45);
  padding: 0;
}

.record-button.recording {
  background: #ff3b30;
}

.close-camera {
  width: 42px;
  height: 42px;
  min-height: 42px;
  padding: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.18);
  color: white;
  font-size: 25px;
}


/* =========================
   VIDEO RESULTAT
========================= */

.result-video {
  width: 100%;
  max-height: 70vh;
  object-fit: contain;
  background: black;
  margin: auto 0;
}

.result-info {
  color: white;
  text-align: center;
  padding: 15px;
}

.result-name {
  font-weight: 700;
  font-size: 13px;
}

.result-meta {
  color: #d1d5db;
  margin-top: 4px;
  font-size: 12px;
}

.result-actions {
  display: flex;
  gap: 8px;
  padding:
    10px 15px
    max(15px, env(safe-area-inset-bottom));
}

.result-actions button {
  flex: 1;
}

@media(max-width:360px) {

  .capture-grid {
    grid-template-columns: 1fr;
  }

  .app {
    padding-left: 12px;
    padding-right: 12px;
  }

}

</style>
</head>


<body>

<div class="app">

<header>

<div class="logo">🧪</div>

<h1>VCA Capture</h1>

<div class="subtitle">
Photos et vidéos d'essais
</div>

</header>


<!-- ESSAI -->

<div class="card">

<div class="section-title">
🏷️ Essai
</div>

<input
id="sessionName"
type="text"
placeholder="Nom de l'essai"
>

<div
id="sessionInfo"
class="session hidden"
>

<div
id="displayName"
class="session-name"
></div>

<div
id="displayDate"
class="session-date"
></div>

</div>

</div>


<!-- CAPTURE -->

<div class="card">

<div class="section-title">
📸 Capture
</div>

<div class="capture-grid">

<label
for="photoInput"
class="action-button primary"
>
📷 Photo
</label>

<input
id="photoInput"
type="file"
accept="image/*"
capture="environment"
multiple
>


<button
class="secondary"
onclick="showQuality()"
>
🎥 Vidéo
</button>

</div>

</div>


<!-- IMPORT -->

<div class="card">

<div class="section-title">
📁 Import
</div>

<label
for="fileInput"
class="action-button secondary"
>
📁 Importer depuis Fichiers
</label>

<input
id="fileInput"
type="file"
accept="image/*,video/*"
multiple
>

</div>


<!-- FICHIERS -->

<div class="card">

<div class="file-count">

<strong>
Fichiers de la série
</strong>

<span id="count">
0 fichier
</span>

</div>


<div
id="empty"
class="info"
>
Aucun fichier pour le moment
</div>


<div
id="grid"
class="grid"
></div>


<div
id="actions"
class="actions hidden"
>

<button
class="primary"
onclick="shareFiles()"
>
💾 Enregistrer dans Fichiers
</button>


<button
class="secondary"
onclick="openFolder()"
>
📂 Ouvrir Dossiers Essais
</button>


<button
class="danger"
onclick="clearFiles()"
>
🗑️ Effacer la série
</button>

</div>

</div>


<div
id="message"
class="info"
>
Donne un nom à l'essai puis commence une capture.
</div>

</div>


<!-- =========================
     CHOIX QUALITÉ
========================= -->

<div
id="qualityModal"
class="modal hidden"
>

<div class="quality-content">

<div class="quality-title">
🎥 Qualité vidéo
</div>


<button
class="quality-button"
onclick="startCamera(3840,2160,30,'4K')"
>

<strong>
4K
</strong>

<span>
3840 × 2160 · 30 fps
</span>

</button>


<button
class="quality-button"
onclick="startCamera(1920,1080,30,'1080p')"
>

<strong>
1080p
</strong>

<span>
1920 × 1080 · 30 fps
</span>

</button>


<button
class="quality-button"
onclick="startCamera(1280,720,30,'720p')"
>

<strong>
720p
</strong>

<span>
1280 × 720 · 30 fps
</span>

</button>


<button
class="secondary"
onclick="closeQuality()"
>
Annuler
</button>

</div>

</div>


<!-- =========================
     CAMÉRA
========================= -->

<div
id="cameraModal"
class="modal hidden"
>

<div class="camera-container">

<video
id="cameraPreview"
autoplay
muted
playsinline
></video>


<div class="camera-top">

<div
id="cameraQuality"
class="camera-quality"
>
</div>


<button
class="close-camera"
onclick="closeCamera()"
>
×
</button>

</div>


<div class="camera-bottom">

<button
id="recordButton"
class="record-button"
onclick="toggleRecording()"
>
</button>

</div>

</div>

</div>


<!-- =========================
     RÉSULTAT VIDÉO
========================= -->

<div
id="resultModal"
class="modal hidden"
>

<video
id="resultVideo"
class="result-video"
controls
playsinline
></video>


<div class="result-info">

<div
id="resultName"
class="result-name"
></div>

<div
id="resultMeta"
class="result-meta"
></div>

</div>


<div class="result-actions">

<button
class="secondary"
onclick="discardLastVideo()"
>
🗑️ Supprimer
</button>


<button
class="primary"
onclick="keepLastVideo()"
>
✓ Garder
</button>

</div>

</div>


<script>


/* =========================
   VARIABLES
========================= */

let files = [];

let photoNumber = 0;

let videoNumber = 0;

let cameraStream = null;

let mediaRecorder = null;

let recordedChunks = [];

let currentVideoFile = null;

let selectedQuality = null;


const sessionName =
document.getElementById(
  "sessionName"
);


/* =========================
   SESSION
========================= */

sessionName.addEventListener(
"input",
function() {

const name =
sessionName.value.trim();

const info =
document.getElementById(
"sessionInfo"
);

if (!name) {

info.classList.add(
"hidden"
);

return;

}

info.classList.remove(
"hidden"
);

document.getElementById(
"displayName"
).textContent =
name;

document.getElementById(
"displayDate"
).textContent =
new Date().toLocaleString(
"fr-FR"
);

}
);


/* =========================
   NOM FICHIER
========================= */

function safeName() {

return (
sessionName.value.trim()
||
"Essai"
)
.normalize("NFD")
.replace(
/[\u0300-\u036f]/g,
""
)
.replace(
/[^a-zA-Z0-9_-]+/g,
"-"
)
.replace(
/-+/g,
"-"
)
.replace(
/^-|-$/g,
""
);

}


/* =========================
   CHOIX QUALITÉ
========================= */

function showQuality() {

document
.getElementById(
"qualityModal"
)
.classList.remove(
"hidden"
);

}


function closeQuality() {

document
.getElementById(
"qualityModal"
)
.classList.add(
"hidden"
);

}


/* =========================
   CAMÉRA
========================= */

async function startCamera(
width,
height,
fps,
label
) {

selectedQuality = {
width,
height,
fps,
label
};


closeQuality();


try {

cameraStream =
await navigator.mediaDevices.getUserMedia({

audio: true,

video: {

facingMode: {
ideal: "environment"
},

width: {
ideal: width
},

height: {
ideal: height
},

frameRate: {
ideal: fps
}

}

});


const video =
document.getElementById(
"cameraPreview"
);

video.srcObject =
cameraStream;


document
.getElementById(
"cameraQuality"
)
.textContent =
label +
" · " +
width +
"×" +
height;


document
.getElementById(
"cameraModal"
)
.classList.remove(
"hidden"
);


}

catch(error) {

alert(
"Impossible d'accéder à la caméra.\n\n" +
error.message
);

}

}


/* =========================
   ENREGISTREMENT
========================= */

function toggleRecording() {

if (
mediaRecorder &&
mediaRecorder.state ===
"recording"
) {

mediaRecorder.stop();

return;

}


recordedChunks = [];


const stream =
cameraStream;


let mimeType =
"";


const possibleTypes = [

"video/mp4",

"video/mp4;codecs=h264",

"video/webm;codecs=vp9",

"video/webm"

];


for (
const type of possibleTypes
) {

if (
MediaRecorder.isTypeSupported(
type
)
) {

mimeType =
type;

break;

}

}


try {

mediaRecorder =
new MediaRecorder(
stream,
mimeType
? {
mimeType:
mimeType,

videoBitsPerSecond:
selectedQuality.label === "4K"
? 12000000
: selectedQuality.label === "1080p"
? 6000000
: 3000000

}
: undefined
);

}

catch(error) {

alert(
"Impossible de démarrer l'enregistrement vidéo."
);

return;

}


mediaRecorder.ondataavailable =
function(event) {

if (
event.data &&
event.data.size > 0
) {

recordedChunks.push(
event.data
);

}

};


mediaRecorder.onstop =
finishRecording;


mediaRecorder.start();


document
.getElementById(
"recordButton"
)
.classList.add(
"recording"
);

}


/* =========================
   FIN ENREGISTREMENT
========================= */

function finishRecording() {

document
.getElementById(
"recordButton"
)
.classList.remove(
"recording"
);


const type =
mediaRecorder.mimeType
||
"video/mp4";


const extension =
type.includes("mp4")
? "mp4"
: "webm";


const blob =
new Blob(
recordedChunks,
{
type
}
);


const filename =
safeName() +
"_video_" +
String(
videoNumber + 1
)
.padStart(2,"0") +
"." +
extension;


currentVideoFile =
new File(
[blob],
filename,
{
type,
lastModified:
Date.now()
}
);


closeCamera();


showVideoResult();

}


/* =========================
   RÉSULTAT
========================= */

function showVideoResult() {

const video =
document.getElementById(
"resultVideo"
);


video.src =
URL.createObjectURL(
currentVideoFile
);


document.getElementById(
"resultName"
).textContent =
currentVideoFile.name;


document.getElementById(
"resultMeta"
).textContent =
formatSize(
currentVideoFile.size
);


document
.getElementById(
"resultModal"
)
.classList.remove(
"hidden"
);

}


function keepLastVideo() {

videoNumber++;


const newName =
safeName() +
"_video_" +
String(videoNumber)
.padStart(2,"0") +
".mp4";


currentVideoFile =
new File(
[
currentVideoFile
],
newName,
{
type:
currentVideoFile.type,

lastModified:
Date.now()
}
);


files.push(
currentVideoFile
);


document
.getElementById(
"resultModal"
)
.classList.add(
"hidden"
);


renderFiles();


document.getElementById(
"message"
).textContent =
"Vidéo ajoutée à la série.";

}


function discardLastVideo() {

currentVideoFile =
null;


document
.getElementById(
"resultModal"
)
.classList.add(
"hidden"
);

}


/* =========================
   FERMER CAMÉRA
========================= */

function closeCamera() {

if (cameraStream) {

cameraStream
.getTracks()
.forEach(
track =>
track.stop()
);

cameraStream =
null;

}


document
.getElementById(
"cameraPreview"
)
.srcObject =
null;


document
.getElementById(
"cameraModal"
)
.classList.add(
"hidden"
);

}


/* =========================
   PHOTOS
========================= */

document
.getElementById(
"photoInput"
)
.addEventListener(
"change",
function(event) {

Array.from(
event.target.files
).forEach(
file => {

photoNumber++;


const filename =
safeName() +
"_photo_" +
String(
photoNumber
).padStart(2,"0") +
".jpg";


files.push(
new File(
[file],
filename,
{
type:
file.type
}
)
);

});


event.target.value = "";

renderFiles();

}
);


/* =========================
   IMPORT
========================= */

document
.getElementById(
"fileInput"
)
.addEventListener(
"change",
function(event) {

Array.from(
event.target.files
).forEach(
file => {

if (
file.type.startsWith(
"image/"
)
) {

photoNumber++;


files.push(
file
);

}

else if (
file.type.startsWith(
"video/"
)
) {

videoNumber++;


files.push(
file
);

}

});


event.target.value = "";

renderFiles();

}
);


/* =========================
   AFFICHAGE
========================= */

function renderFiles() {

const grid =
document.getElementById(
"grid"
);

grid.innerHTML = "";


files.forEach(
(file,index) => {

const item =
document.createElement(
"div"
);

item.className =
"item";


let media;


if (
file.type.startsWith(
"video/"
)
) {

media =
document.createElement(
"video"
);

media.src =
URL.createObjectURL(
file
);

media.muted =
true;

media.playsInline =
true;

item.onclick =
() =>
openVideo(file);

}

else {

media =
document.createElement(
"img"
);

media.src =
URL.createObjectURL(
file
);

}


const badge =
document.createElement(
"div"
);

badge.className =
"badge";

badge.textContent =
file.type.startsWith(
"video/"
)
? "VIDÉO"
: "PHOTO";


const info =
document.createElement(
"div"
);

info.className =
"file-info";

info.textContent =
formatSize(
file.size
);


const del =
document.createElement(
"button"
);

del.className =
"delete";

del.textContent =
"×";

del.onclick =
event => {

event.stopPropagation();

files.splice(
index,
1
);

renderFiles();

};


item.appendChild(media);

item.appendChild(badge);

item.appendChild(info);

item.appendChild(del);

grid.appendChild(item);

});


document.getElementById(
"count"
).textContent =
files.length +
" fichier" +
(files.length > 1
? "s"
: "");


document.getElementById(
"empty"
).classList.toggle(
"hidden",
files.length > 0
);


document.getElementById(
"actions"
).classList.toggle(
"hidden",
files.length === 0
);

}


/* =========================
   LECTEUR
========================= */

function openVideo(file) {

const video =
document.getElementById(
"resultVideo"
);

video.src =
URL.createObjectURL(
file
);

document.getElementById(
"resultName"
).textContent =
file.name;

document.getElementById(
"resultMeta"
).textContent =
formatSize(
file.size
);

document
.getElementById(
"resultModal"
)
.classList.remove(
"hidden"
);

}


/* =========================
   TAILLE
========================= */

function formatSize(bytes) {

if (
bytes <
1024
) {

return bytes +
" o";

}

if (
bytes <
1024*1024
) {

return (
bytes/1024
).toFixed(1)
+
" Ko";

}

return (
bytes/
(1024*1024)
).toFixed(1)
+
" Mo";

}


/* =========================
   EXPORT
========================= */

async function shareFiles() {

if (!files.length)
return;


if (
navigator.canShare &&
navigator.canShare({
files
})
) {

try {

await navigator.share({

files,

title:
sessionName.value ||
"Essai",

text:
"VCA Capture"

});

}

catch(error) {

console.log(error);

}

}

else {

alert(
"Le partage de fichiers n'est pas disponible."
);

}

}


/* =========================
   SHAREPOINT
========================= */

function openFolder() {

window.location.href =
"https://richemont.sharepoint.com/sites/VCAlab/Dossiers%20Essais/";

}


/* =========================
   EFFACER
========================= */

function clearFiles() {

files = [];

photoNumber = 0;

videoNumber = 0;

renderFiles();

}


/* =========================
   INIT
========================= */

renderFiles();

</script>

</body>
</html>
